<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liftoff</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card" novalidate>
      <h1 class="brand">Liftoff</h1>
      <p class="muted">Onboarding for new engineers. Sign in to continue.</p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <p id="login-error" class="error" role="alert" hidden></p>

      <button id="login-button" type="submit" class="button primary">Sign in</button>
    </form>
  </main>

  <!-- Signed in -->
  <div id="app-view" hidden>
    <header class="topbar">
      <span class="brand">Liftoff</span>
      <div class="who">
        <span id="user-name" class="user-name"></span>
        <span id="user-role" class="badge"></span>
        <button id="signout-button" type="button" class="button">Sign out</button>
      </div>
    </header>

    <main class="content">
      <section id="dashboard-view" hidden>
        <div class="page-head dash-head">
          <div>
            <h2>Cohort dashboard</h2>
            <p id="dash-cohort-line" class="muted"></p>
          </div>
          <div class="picker">
            <label for="cohort-picker">Cohort</label>
            <select id="cohort-picker"></select>
          </div>
        </div>

        <p id="dashboard-error" class="error" role="alert" hidden></p>

        <div id="dashboard-body" hidden>
          <div class="kpis">
            <div class="card kpi">
              <span class="kpi-label">Engineers in cohort</span>
              <span id="kpi-count" class="kpi-value"></span>
            </div>
            <div class="card kpi">
              <span class="kpi-label">Pre-work complete</span>
              <span id="kpi-prework" class="kpi-value"></span>
            </div>
            <div class="card kpi">
              <span class="kpi-label">Blocked</span>
              <span id="kpi-blocked" class="kpi-value"></span>
            </div>
          </div>

          <div class="card table-card">
            <table class="roster">
              <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col" class="col-team">Team</th>
                  <th scope="col" class="col-manager">Manager</th>
                  <th scope="col" class="col-percent">Complete</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="roster-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="checklist-view" hidden>
        <div class="page-head">
          <h2>My checklist</h2>
          <p id="cohort-line" class="muted"></p>
        </div>

        <div id="checklist-summary" class="card summary" hidden>
          <div class="summary-row">
            <span>Your progress</span>
            <span id="progress-text"></span>
          </div>
          <div id="progress-bar" class="progress" role="progressbar" aria-label="Checklist progress" aria-valuemin="0">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>

        <p id="checklist-error" class="error" role="alert" hidden></p>
        <div id="checklist-body"></div>
      </section>

      <div id="panel-backdrop" class="backdrop" hidden></div>
      <aside id="person-panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-name" hidden>
        <div class="panel-head">
          <div>
            <h2 id="panel-name"></h2>
            <p id="panel-sub" class="muted"></p>
          </div>
          <button id="panel-close" type="button" class="button" aria-label="Close">✕</button>
        </div>
        <div id="panel-summary"></div>
        <p id="panel-error" class="error" role="alert" hidden></p>
        <div id="panel-body"></div>
      </aside>

      <section id="no-role-view" hidden>
        <h2>No access yet</h2>
        <div class="card placeholder">
          <p>Your account doesn't have a role. Ask your program coordinator to set one up.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
